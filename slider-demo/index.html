<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rugby XV Draft – Carousel Selector</title>

    <link rel="stylesheet" href="https://raw.githubusercontent.com/sjwickes9/rugby-draft-sim-staging/287153233b54f9884aff5a2dd0cd978ad9e814ff/mp/lobby.css">
    <link rel="stylesheet" href="carousel.css">
</head>

<body>

<header class="topbar">
    <div class="bug">
        RUGBY XV DRAFT
    </div>
</header>

<div class="rule-line"></div>


<main class="block">

    <div class="eyebrow">
        World Cup Edition
    </div>

    <h1>
        Select Tournament Era
    </h1>

    <p>
        Build your ultimate XV from rugby history.
    </p>


    <div id="valuePicker" class="carousel-picker"></div>


</main>


<script src="carousel.js"></script>

<script>

const picker = new CarouselPicker({

    element:"#valuePicker",

    values:[
        1987,
        1991,
        1995,
        1999,
        2003,
        2007,
        2011,
        2015,
        2019,
        2023,
        "All Time"
    ],

    value:2023,

    onChange(value){

        console.log("Selected:", value);

    }

});

</script>

</body>
</html>
